<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>How Gay Is My Neighborhood?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root {
      /* Palette — a restrained violet → teal ramp, closer to FT / Guardian / Bloomberg than ColorBrewer */
      --bg:        #0f1115;
      --surface:   #ffffff;
      --ink:       #1a1d24;
      --ink-dim:   #5a6171;
      --rule:      #e6e8ec;
      --accent:    #6366f1;   /* indigo, used for UI focus / highlights */
      --highlight: #fbbf24;   /* amber, for the search-selected community */
      --enclave:   #ec4899;   /* magenta-pink, for the historical enclave overlay */

      /* Choropleth ramp — perceptually uniform-ish, avoids pure primaries */
      --c1: #ecf0f5;   /* near-white cool grey */
      --c2: #c7d4e8;   /* soft periwinkle */
      --c3: #8aa3d4;   /* mid blue-violet */
      --c4: #6366f1;   /* indigo */
      --c5: #3730a3;   /* deep indigo */
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px 12px;
      background: var(--bg);
      color: #fff;
      flex: 0 0 auto;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    header .subtitle {
      margin-top: 2px;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.02em;
    }

    #map {
      flex: 1 1 auto;
      position: relative;
      min-height: 300px;
      width: 100%;
    }

    footer {
      background: var(--bg);
      color: rgba(255,255,255,0.6);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 10px 20px;
      flex: 0 0 auto;
      border-top: 1px solid rgba(255,255,255,0.08);
      letter-spacing: 0.02em;
    }

    footer a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      transition: border-color 0.15s;
    }

    footer a:hover { border-bottom-color: #fff; }

    /* ---------- Search ---------- */
    .search-wrap {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      background: var(--surface);
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(15, 17, 21, 0.12), 0 1px 2px rgba(15, 17, 21, 0.08);
      font-size: 13px;
      border: 1px solid var(--rule);
      overflow: hidden;
    }

    .search-wrap input {
      width: 260px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      color: var(--ink);
    }

    .search-wrap input::placeholder {
      color: var(--ink-dim);
    }

    .search-wrap input:focus {
      box-shadow: inset 0 0 0 2px var(--accent);
    }

    .search-results {
      max-height: 240px;
      overflow-y: auto;
      border-top: 1px solid var(--rule);
    }

    .search-results div {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--rule);
      font-size: 13px;
      color: var(--ink);
    }

    .search-results div:last-child { border-bottom: none; }

    .search-results div:hover,
    .search-results div.active {
      background: #f4f5f9;
      color: var(--accent);
    }

    .search-results:empty { display: none; }

    /* ---------- Legend ---------- */
    .legend {
      position: absolute;
      bottom: 24px;
      right: 14px;
      z-index: 2;
      background: var(--surface);
      padding: 12px 14px;
      font-size: 12px;
      line-height: 20px;
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(15, 17, 21, 0.12), 0 1px 2px rgba(15, 17, 21, 0.08);
      border-radius: 8px;
      border: 1px solid var(--rule);
      min-width: 200px;
    }

    .legend-title {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
      font-family: 'IBM Plex Mono', monospace;
    }

    .legend-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--rule);
    }

    .legend-row {
      cursor: pointer;
      display: flex;
      align-items: center;
      margin-bottom: 2px;
      user-select: none;
      padding: 2px 4px;
      margin-left: -4px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .legend-row:hover { background: #f4f5f9; }
    .legend-row:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .legend-row .swatch {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 10px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.08);
      flex: 0 0 auto;
    }

    .legend-row .swatch.outline {
      background: rgba(236, 72, 153, 0.12);
      border: 1.5px dashed var(--enclave);
    }

    .legend-row .swatch.dot {
      background: var(--enclave);
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px var(--enclave);
      width: 12px;
      height: 12px;
      margin-left: 2px;
      margin-right: 12px;
    }

    .legend-row.inactive { opacity: 0.35; }
    .legend-row.inactive .swatch { filter: grayscale(0.4); }

    /* ---------- Popup ---------- */
    .maplibregl-popup-content {
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(15, 17, 21, 0.18), 0 1px 2px rgba(15, 17, 21, 0.06);
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--rule);
    }

    .maplibregl-popup-close-button {
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      padding: 4px 8px;
      right: 2px;
      top: 2px;
    }

    .maplibregl-popup-close-button:hover {
      color: #fff;
      background: transparent;
    }

    .popup-header {
      background: var(--ink);
      color: #fff;
      padding: 10px 14px;
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: 'IBM Plex Mono', monospace;
    }

    .popup-header.enclave-header {
      background: var(--enclave);
    }

    .popup-body {
      background: #fff;
      color: var(--ink);
      padding: 12px 14px;
      font-size: 14px;
      max-width: 260px;
    }

    .popup-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 4px;
      letter-spacing: -0.005em;
    }

    .popup-meta {
      font-size: 11px;
      color: var(--ink-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 8px;
    }

    .popup-desc {
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink);
    }

    .popup-stat {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .popup-stat .stat-label {
      font-size: 11px;
      color: var(--ink-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'IBM Plex Mono', monospace;
    }

    .popup-stat .stat-value {
      font-weight: 700;
      font-size: 18px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Status banner ---------- */
    .status-banner {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      padding: 8px 14px;
      border-left: 3px solid var(--accent);
      font-size: 12px;
      box-shadow: 0 4px 14px rgba(15, 17, 21, 0.15);
      z-index: 3;
      max-width: 80%;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* MapLibre navigation control tweaks */
    .maplibregl-ctrl-group {
      border-radius: 8px !important;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(15, 17, 21, 0.12), 0 1px 2px rgba(15, 17, 21, 0.08) !important;
      border: 1px solid var(--rule) !important;
    }
  </style>
</head>
<body>

<header>
  <h1>How Gay Is My Neighborhood?</h1>
  <div class="subtitle">Same-sex couple households by census tract · Chicago · 2020</div>
</header>

<div id="map" aria-label="Map of same-sex household share by Chicago census tract">
  <div class="search-wrap">
    <input
      id="search-input"
      type="text"
      placeholder="Search a community area…"
      aria-label="Search Chicago community areas"
      autocomplete="off"
    >
    <div class="search-results" id="search-results" role="listbox"></div>
  </div>
</div>

<footer>
  DATA: <a href="https://data.census.gov/table/DECENNIALDP2020.DP1" target="_blank" rel="noopener">U.S. Census Bureau, Decennial 2020</a>
  &nbsp;·&nbsp; HISTORICAL ENCLAVE: AUTHOR RESEARCH
  &nbsp;·&nbsp; BUILT WITH MAPLIBRE GL
</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const MAPTILER_KEY = 'suJ4vITHrTOiQeBY9VAK';
const TRACTS_URL = 'https://raw.githubusercontent.com/jakec04/chicago_geos/e339130cd86a3ae95bc895e18a8c1f913e497dc3/merged_household_percent.geojson';
const BOUNDARIES_URL = 'https://raw.githubusercontent.com/jakec04/chicago_geos/e339130cd86a3ae95bc895e18a8c1f913e497dc3/Boundaries%20-%20Community%20Areas_20250616%20copy.geojson';

// ----------------------------------------------------------------
// Historical queer enclave overlay (your research polygon).
// Original geometry was a closed LineString — we render it as both a
// translucent fill and a bold dashed outline.
// ----------------------------------------------------------------
const ENCLAVE_COORDS = [
  [-87.6263168352894, 41.81650971816629],
  [-87.60664964932118, 41.81681955365093],
  [-87.60652173266483, 41.80952610541348],
  [-87.62602902281171, 41.809240070913404],
  [-87.6263168352894, 41.81653355171892]
];

const enclavePolygon = {
  type: 'FeatureCollection',
  features: [{
    type: 'Feature',
    properties: { name: 'Historical queer enclave (study area)' },
    geometry: { type: 'Polygon', coordinates: [ENCLAVE_COORDS] }
  }]
};

// ----------------------------------------------------------------
// Dummy historical points within the enclave — placeholder data
// for layout/styling. Replace with real research findings.
// ----------------------------------------------------------------
const dummyPoints = {
  type: 'FeatureCollection',
  features: [
    {
      type: 'Feature',
      properties: {
        name: 'The Cabin Inn',
        kind: 'Bar / nightclub',
        years: '1934–1940',
        description: 'Placeholder description: a Black-owned cabaret that hosted female impersonators and drew mixed-race, mixed-orientation crowds during the late Bronzeville cabaret era.'
      },
      geometry: { type: 'Point', coordinates: [-87.6195, 41.8155] }
    },
    {
      type: 'Feature',
      properties: {
        name: 'Mr. Henry\u2019s Annex',
        kind: 'Social club',
        years: 'c. 1948–1955',
        description: 'Placeholder description: an after-hours club referenced in oral histories as a gathering space for Black gay men in the postwar period.'
      },
      geometry: { type: 'Point', coordinates: [-87.6125, 41.8138] }
    },
    {
      type: 'Feature',
      properties: {
        name: 'Wabash Rooming House',
        kind: 'Residence',
        years: 'c. 1925–1942',
        description: 'Placeholder description: a single-room-occupancy hotel that appears in multiple period accounts as housing single men working in the entertainment district.'
      },
      geometry: { type: 'Point', coordinates: [-87.6240, 41.8118] }
    },
    {
      type: 'Feature',
      properties: {
        name: 'Finnie\u2019s Halloween Ball venue',
        kind: 'Drag ball site',
        years: '1935–1960s',
        description: 'Placeholder description: rotating site of the Finnie\u2019s Ball, the city\u2019s largest Black drag ball, which moved among South Side venues.'
      },
      geometry: { type: 'Point', coordinates: [-87.6155, 41.8098] }
    },
    {
      type: 'Feature',
      properties: {
        name: 'State Street tavern',
        kind: 'Bar / nightclub',
        years: 'c. 1953–1967',
        description: 'Placeholder description: tavern flagged in police vice reports as a known meeting place for gay patrons; closed during a citywide license crackdown.'
      },
      geometry: { type: 'Point', coordinates: [-87.6258, 41.8132] }
    }
  ]
};

// Violet → teal ramp. Bins use half-open intervals [min, max).
const colorBins = [
  { label: '0–2%',   color: '#ecf0f5', min: 0,   max: 3 },
  { label: '3–5%',   color: '#c7d4e8', min: 3,   max: 6 },
  { label: '6–10%',  color: '#8aa3d4', min: 6,   max: 11 },
  { label: '11–15%', color: '#6366f1', min: 11,  max: 16 },
  { label: '16%+',   color: '#3730a3', min: 16,  max: Infinity }
];

const activeBins = new Set(colorBins.map(b => b.label));

function showStatus(msg, isError) {
  let b = document.querySelector('.status-banner');
  if (!b) {
    b = document.createElement('div');
    b.className = 'status-banner';
    document.getElementById('map').appendChild(b);
  }
  b.textContent = msg;
  b.style.borderLeftColor = isError ? '#ef4444' : '#6366f1';
}

const FALLBACK_STYLE = {
  version: 8,
  glyphs: 'https://cdn.protomaps.com/fonts/pbf/{fontstack}/{range}.pbf',
  sources: {
    'carto-light': {
      type: 'raster',
      tiles: [
        'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png',
        'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png',
        'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png',
        'https://d.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png'
      ],
      tileSize: 256,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      maxzoom: 19
    }
  },
  layers: [{ id: 'carto-light', type: 'raster', source: 'carto-light' }]
};

async function chooseStyle() {
  const mapTilerStyle = `https://api.maptiler.com/maps/dataviz/style.json?key=${MAPTILER_KEY}`;
  try {
    const res = await fetch(mapTilerStyle);
    if (!res.ok) {
      console.warn('MapTiler style HTTP', res.status, '— using CARTO fallback');
      showStatus('Using CARTO fallback basemap', true);
      return FALLBACK_STYLE;
    }
    return mapTilerStyle;
  } catch (err) {
    console.warn('MapTiler fetch failed — using CARTO fallback', err);
    showStatus('Using CARTO fallback basemap', true);
    return FALLBACK_STYLE;
  }
}

(async () => {
  const style = await chooseStyle();

  const map = new maplibregl.Map({
    container: 'map',
    style,
    center: [-87.630782, 41.858790],
    zoom: 10,
    minZoom: 8,
    maxZoom: 16
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

  setTimeout(() => map.resize(), 0);
  setTimeout(() => map.resize(), 200);
  window.addEventListener('resize', () => map.resize());

  map.on('error', (e) => {
    console.error('MapLibre error:', e && e.error);
  });

  function parsePercent(p) {
    if (typeof p === 'number') return p;
    if (typeof p === 'string') return parseFloat(p.replace('%', ''));
    return NaN;
  }

  function buildColorExpression() {
    const stepExpr = ['step', ['to-number', ['get', 'percent'], -1], colorBins[0].color];
    for (let i = 1; i < colorBins.length; i++) {
      stepExpr.push(colorBins[i].min, colorBins[i].color);
    }
    return [
      'case',
      ['<', ['to-number', ['get', 'percent'], -1], 0], 'rgba(0,0,0,0)',
      stepExpr
    ];
  }

  function buildVisibilityFilter() {
    const conditions = ['any'];
    colorBins.forEach(bin => {
      if (!activeBins.has(bin.label)) return;
      const p = ['to-number', ['get', 'percent'], -1];
      if (bin.max === Infinity) conditions.push(['>=', p, bin.min]);
      else conditions.push(['all', ['>=', p, bin.min], ['<', p, bin.max]]);
    });
    return conditions;
  }

  map.on('load', () => {
    map.addSource('tracts', { type: 'geojson', data: TRACTS_URL });

    map.addLayer({
      id: 'tracts-fill',
      type: 'fill',
      source: 'tracts',
      paint: {
        'fill-color': buildColorExpression(),
        'fill-opacity': 0.82,
        'fill-outline-color': 'rgba(255, 255, 255, 0.4)'
      },
      filter: buildVisibilityFilter()
    });

    map.addSource('boundaries', { type: 'geojson', data: BOUNDARIES_URL });

    map.addLayer({
      id: 'boundaries-line',
      type: 'line',
      source: 'boundaries',
      paint: {
        'line-color': '#1a1d24',
        'line-width': [
          'interpolate', ['linear'], ['zoom'],
          9,  1,
          12, 1.8,
          15, 2.4
        ],
        'line-opacity': 0.7
      }
    });

    map.addLayer({
      id: 'boundaries-highlight',
      type: 'line',
      source: 'boundaries',
      paint: {
        'line-color': '#fbbf24',
        'line-width': 4,
        'line-opacity': 0.95
      },
      filter: ['==', ['get', '__nothing__'], 'nothing']
    });

    // ----------------------------------------------------------------
    // ENCLAVE LAYERS
    // ----------------------------------------------------------------
    map.addSource('enclave', { type: 'geojson', data: enclavePolygon });

    map.addLayer({
      id: 'enclave-fill',
      type: 'fill',
      source: 'enclave',
      paint: {
        'fill-color': '#ec4899',
        'fill-opacity': 0.12
      }
    });

    map.addLayer({
      id: 'enclave-outline',
      type: 'line',
      source: 'enclave',
      paint: {
        'line-color': '#ec4899',
        'line-width': 2.5,
        'line-dasharray': [3, 2],
        'line-opacity': 0.95
      }
    });

    // Community labels go AFTER enclave so they sit on top
    map.addLayer({
      id: 'boundaries-labels',
      type: 'symbol',
      source: 'boundaries',
      layout: {
        'text-field': [
          'coalesce',
          ['get', 'community'],
          ['get', 'community_area'],
          ['get', 'name'],
          ''
        ],
        'text-font': ['Noto Sans Regular'],
        'text-size': [
          'interpolate', ['linear'], ['zoom'],
          9,  9,
          11, 10.5,
          14, 13
        ],
        'text-transform': 'uppercase',
        'text-letter-spacing': 0.08,
        'text-max-width': 8,
        'text-allow-overlap': false,
        'symbol-placement': 'point'
      },
      paint: {
        'text-color': '#1a1d24',
        'text-opacity': [
          'interpolate', ['linear'], ['zoom'],
          9.5, 0,
          10,  0.7,
          14,  0.85
        ],
        'text-halo-color': 'rgba(255, 255, 255, 0.9)',
        'text-halo-width': 1.6,
        'text-halo-blur': 0.4
      }
    });

    // ----------------------------------------------------------------
    // POINT MARKERS (sit on top of everything)
    // ----------------------------------------------------------------
    map.addSource('points', { type: 'geojson', data: dummyPoints });

    // Halo (white ring for legibility on any basemap)
    map.addLayer({
      id: 'points-halo',
      type: 'circle',
      source: 'points',
      paint: {
        'circle-radius': [
          'interpolate', ['linear'], ['zoom'],
          10, 5,
          14, 9,
          16, 12
        ],
        'circle-color': '#ffffff',
        'circle-opacity': 0.95,
        'circle-stroke-width': 0
      }
    });

    map.addLayer({
      id: 'points-circle',
      type: 'circle',
      source: 'points',
      paint: {
        'circle-radius': [
          'interpolate', ['linear'], ['zoom'],
          10, 3.5,
          14, 6.5,
          16, 9
        ],
        'circle-color': '#ec4899',
        'circle-stroke-color': '#9d174d',
        'circle-stroke-width': 1.2,
        'circle-opacity': 1
      }
    });

    const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: true, maxWidth: '280px' });

    // Tract popup (kept as before)
    map.on('click', 'tracts-fill', (e) => {
      // If a point was clicked, let that handler win
      const pointHits = map.queryRenderedFeatures(e.point, { layers: ['points-circle'] });
      if (pointHits.length) return;

      if (!e.features.length) return;
      const f = e.features[0];
      const tractId = f.properties.NAME || f.properties.TRACTCE || 'Unknown';
      const pct = parsePercent(f.properties.percent);
      const formatted = !isNaN(pct) ? pct.toFixed(1) + '%' : '—';
      popup.setLngLat(e.lngLat).setHTML(`
        <div class="popup-header">Census Tract ${tractId}</div>
        <div class="popup-body">
          <div class="popup-stat">
            <span class="stat-label">Same-sex couples</span>
            <span class="stat-value">${formatted}</span>
          </div>
        </div>
      `).addTo(map);
    });

    // Point popup
    map.on('click', 'points-circle', (e) => {
      if (!e.features.length) return;
      e.originalEvent.stopPropagation && e.originalEvent.stopPropagation();
      const f = e.features[0];
      const p = f.properties;
      popup.setLngLat(f.geometry.coordinates).setHTML(`
        <div class="popup-header enclave-header">${escapeHtml(p.kind || 'Site')}</div>
        <div class="popup-body">
          <div class="popup-name">${escapeHtml(p.name || '')}</div>
          <div class="popup-meta">${escapeHtml(p.years || '')}</div>
          <div class="popup-desc">${escapeHtml(p.description || '')}</div>
        </div>
      `).addTo(map);
    });

    map.on('mouseenter', 'tracts-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'tracts-fill', () => { map.getCanvas().style.cursor = ''; });
    map.on('mouseenter', 'points-circle', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'points-circle', () => { map.getCanvas().style.cursor = ''; });

    buildLegend();
    setupSearch();
  });

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function buildLegend() {
    const legend = document.createElement('div');
    legend.className = 'legend';
    legend.innerHTML = '<div class="legend-title">Share of couple households</div>';

    colorBins.forEach(bin => {
      const row = document.createElement('div');
      row.className = 'legend-row';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      row.setAttribute('aria-pressed', 'true');
      row.innerHTML = `<span class="swatch" style="background:${bin.color}"></span>${bin.label}`;

      const toggle = () => {
        if (activeBins.has(bin.label)) {
          activeBins.delete(bin.label);
          row.classList.add('inactive');
          row.setAttribute('aria-pressed', 'false');
        } else {
          activeBins.add(bin.label);
          row.classList.remove('inactive');
          row.setAttribute('aria-pressed', 'true');
        }
        map.setFilter('tracts-fill', buildVisibilityFilter());
      };

      row.addEventListener('click', toggle);
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      legend.appendChild(row);
    });

    // Historical overlay section
    const hist = document.createElement('div');
    hist.className = 'legend-section';
    hist.innerHTML = `
      <div class="legend-title">Historical Layer</div>
      <div class="legend-row" style="cursor:default" tabindex="-1" aria-disabled="true">
        <span class="swatch outline"></span>Study area (c. 1925–1965)
      </div>
      <div class="legend-row" style="cursor:default" tabindex="-1" aria-disabled="true">
        <span class="swatch dot"></span>Documented site
      </div>
    `;
    legend.appendChild(hist);

    document.getElementById('map').appendChild(legend);
  }

  function setupSearch() {
    const input = document.getElementById('search-input');
    const resultsEl = document.getElementById('search-results');

    fetch(BOUNDARIES_URL)
      .then(r => {
        if (!r.ok) throw new Error('Boundaries fetch failed');
        return r.json();
      })
      .then(data => {
        const features = data.features.map(f => ({
          name: f.properties.community || f.properties.community_area || f.properties.name || 'Unknown',
          feature: f
        }));

        let activeIdx = -1;
        let currentMatches = [];

        function renderResults(matches) {
          resultsEl.innerHTML = '';
          activeIdx = -1;
          currentMatches = matches;
          matches.slice(0, 8).forEach((m, i) => {
            const row = document.createElement('div');
            row.setAttribute('role', 'option');
            row.textContent = m.name;
            row.addEventListener('click', () => selectMatch(m));
            row.addEventListener('mouseenter', () => {
              resultsEl.querySelectorAll('div').forEach(d => d.classList.remove('active'));
              row.classList.add('active');
              activeIdx = i;
            });
            resultsEl.appendChild(row);
          });
        }

        function selectMatch(match) {
          const bbox = getBBox(match.feature);
          map.fitBounds(bbox, { padding: 60, maxZoom: 13, duration: 800 });

          const nameKeys = ['community', 'community_area', 'name'];
          const keyUsed = nameKeys.find(k => match.feature.properties[k] !== undefined);
          if (keyUsed) {
            map.setFilter('boundaries-highlight', ['==', ['get', keyUsed], match.name]);
          }
          setTimeout(() => {
            map.setFilter('boundaries-highlight', ['==', ['get', '__nothing__'], 'nothing']);
          }, 3000);

          const center = bboxCenter(bbox);
          new maplibregl.Popup({ closeButton: true, maxWidth: '280px' })
            .setLngLat(center)
            .setHTML(`
              <div class="popup-header">Community Area</div>
              <div class="popup-body">
                <div class="popup-name">${escapeHtml(match.name)}</div>
              </div>
            `)
            .addTo(map);

          input.value = match.name;
          resultsEl.innerHTML = '';
        }

        input.addEventListener('input', () => {
          const q = input.value.trim().toLowerCase();
          if (!q) { resultsEl.innerHTML = ''; return; }
          renderResults(features.filter(f => f.name.toLowerCase().includes(q)));
        });

        input.addEventListener('keydown', (e) => {
          const rows = resultsEl.querySelectorAll('div');
          if (!rows.length) return;
          if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, rows.length - 1); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); }
          else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIdx >= 0 && currentMatches[activeIdx]) selectMatch(currentMatches[activeIdx]);
            else if (currentMatches[0]) selectMatch(currentMatches[0]);
            return;
          } else if (e.key === 'Escape') { resultsEl.innerHTML = ''; return; }
          else return;
          rows.forEach(r => r.classList.remove('active'));
          if (rows[activeIdx]) rows[activeIdx].classList.add('active');
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('.search-wrap')) resultsEl.innerHTML = '';
        });
      })
      .catch(err => {
        console.error(err);
        input.placeholder = 'Search unavailable';
        input.disabled = true;
      });
  }

  function getBBox(feature) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const walk = (coords) => {
      if (typeof coords[0] === 'number') {
        minX = Math.min(minX, coords[0]); maxX = Math.max(maxX, coords[0]);
        minY = Math.min(minY, coords[1]); maxY = Math.max(maxY, coords[1]);
      } else coords.forEach(walk);
    };
    walk(feature.geometry.coordinates);
    return [[minX, minY], [maxX, maxY]];
  }

  function bboxCenter(bbox) {
    return [(bbox[0][0] + bbox[1][0]) / 2, (bbox[0][1] + bbox[1][1]) / 2];
  }
})();
</script>
